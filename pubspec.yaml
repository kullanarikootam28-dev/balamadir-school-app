name: school_management_app
description: A production-ready School Management Application built with Flutter + Supabase.
publish_to: 'none'
version: 1.0.8+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Supabase — injected via Phase 1 dependency pipeline
  supabase_flutter: ^2.3.4

  # UI & UX
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  equatable: ^2.0.5
  logger: ^2.0.2+1
  shared_preferences: ^2.2.2
  table_calendar: ^3.1.2
  fl_chart: ^0.68.0

  # Spreadsheet import
  file_picker: ^8.1.2
  excel: ^4.0.6
  csv: ^6.0.0

  # Fee receipts
  pdf: ^3.11.1
  share_plus: ^10.1.3
  path_provider: ^2.1.4

  # Profile detail (WhatsApp deep link)
  url_launcher: ^6.3.1

  # QR-based daily teacher attendance
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Cloudflare R2 storage gateway (Worker upload/download)
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  # Poppins font files are not present in assets/fonts/ yet. google_fonts is
  # already a dependency; use GoogleFonts.poppins() instead of a local family
  # until the .ttf files are added, then restore this fonts: block.

flutter_launcher_icons:
  android: true
  image_path: "assets/images/logo_icon_legacy.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_icon_foreground.png"
  windows:
    generate: true
    image_path: "assets/images/logo_icon_legacy.png"
    icon_size: 256

# The auth library (a dependency of supabase_flutter) with one patch: token
# expiry is measured on this device's clock, so a PC with a wrong clock or
# time zone can still sign in. See third_party/gotrue/BALAMANDIR_PATCH.md.
dependency_overrides:
  gotrue:
    path: third_party/gotrue
